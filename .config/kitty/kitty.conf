# Font
# font_family      JetBrains Mono Nerd Font
# bold_font        auto
# italic_font      auto
# bold_italic_font auto
font_size        12.0

# Cursor
cursor_shape     block
cursor_beam_thickness 1.0
cursor_blink    true

# Scrolling
scrollback_lines 10000

# Window
window_padding_width 10

# Tab bar
enable_tab_bar no

# Mouse
mouse_hide_wait 3000
mouse_hide_wait_with_selection 5000

# Ligatures
enable_ligatures true

# Background opacity (0-1)
background_opacity 0.85
dynamic_background_opacity true

# Other tweaks
term xterm-kitty



# BEGIN_KITTY_THEME
# Gruvbox Dark Hard
include current-theme.conf
# END_KITTY_THEME


# BEGIN_KITTY_FONTS
font_family      family="FiraCode Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# Switch directly to numbered tabs with Alt+1..Alt+9
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

map super+u           set_background_opacity 1
map super+shift+u set_background_opacity default
