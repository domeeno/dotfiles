conky.config = {
    alignment = 'top_right',
    background = false,
    double_buffer = true,
    update_interval = 1.0,

    -- Window settings
    own_window = true,
    own_window_type = 'override',
    own_window_transparent = true,
    own_window_argb_visual = true,
    -- own_window_argb_value = 150, -- opacity (0-255)
    own_window_hints = 'undecorated,above,sticky,skip_taskbar,skip_pager',

    -- Fonts & colors
    use_xft = true,
    font = 'JetBrains Mono:size=12',
    default_color = 'white',

    -- Drawing
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,

    minimum_width = 250,
}

conky.text = [[
${color white}CPU: ${cpu cpu0}% ${alignr}${cpubar 6}
GPU: ${exec nvidia-smi --query-gpu=utilization.gpu,temperature.gpu --format=csv,noheader,nounits | awk -F',' '{print $1"% @ "$2"°C"}'}
RAM: $mem / $memmax ($memperc%) ${alignr}${membar 6}
Disk: ${fs_used /} / ${fs_size /} (${fs_free_perc /}% free)
Uptime: $uptime
]]

