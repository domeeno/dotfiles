"$schema" = "https://starship.rs/config-schema.json"

format = """
[| ](bold purple)\
($os$username)\
( [](bold purple)$directory)\
( [|](bold color_red)($git_branch$git_metrics)([ ](dimmed color_red)$git_status))\
( [|](bold color_aqua)($c$cpp$cmake$rust$golang$bun$nodejs$php$java$kotlin$haskell$lua$python$dotnet$elixir$zig))\
( [|](bold color_blue)($docker_context$conda$pixi$kubernetes$helm))\
[|](bold color_green)\
$fill\
$cmd_duration\
$battery\
$time\
$line_break$character"""

palette = "gruvbox_dark"

[palettes.gruvbox_dark]
color_fg0 = "#fbf1c7"
color_bg1 = "#3c3836"
color_bg3 = "#665c54"
color_blue = "#458588"
color_aqua = "#689d6a"
color_green = "#98971a"
color_orange = "#d65d0e"
color_purple = "#b16286"
color_red = "#cc241d"
color_yellow = "#d79921"
color_bright_aqua = "#74b5af"

[fill]
symbol = " "

[os]
disabled = false
style = "color_red"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
style_user = "bold color_yellow"
style_root = "bold color_red"
format = "[ $user]($style) "
disabled = false
show_always = true

[directory]
style = "purple"
format = "[ $path ]($style)"
truncation_length = 2
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"dev" = "󰲋 "

[git_branch]
symbol = ""
style = "color_red"
format = "[[ $symbol $branch ](color_red)]($style)"

[git_status]
style = "color_fg0"
format = "([$conflicted$stashed$deleted$renamed$modified$typechanged$staged$untracked$ahead_behind]($style))"

# Conflicts
conflicted = "[󰞇 ${count}](bold color_red) "

# Remote tracking status
ahead = "[󰁝 ${count}](bold color_green) "
behind = "[󰁅 ${count}](bold color_red) "
diverged = "[󰹹 ⇡${ahead_count} ⇣${behind_count}](bold color_purple) "
up_to_date = ""

# File status
staged = "[ ${count}](bold color_aqua) "
modified = "[ ${count}](bold color_yellow) "
untracked = "[ ${count}](bold color_bright_aqua) "
renamed = "[ ${count}](bold color_blue) "
deleted = "[ ${count}](bold color_red) "
stashed = "[ ${count}](color_bg3) "
typechanged = "[󰉺 ${count}](bold color_purple) "

[git_metrics]
format = "([▴$added]($added_style))([▿$deleted]($deleted_style))"
added_style = "dimmed color_green"
deleted_style = "dimmed color_red"
ignore_submodules = true
disabled = false

[nodejs]
symbol = ""
style = "bold green"
format = "[ $symbol($version )]($style)"

[bun]
symbol = ""
style = "bold red"
format = "[ $symbol($version )]($style)"

[c]
symbol = " "
style = "149 bold"
format = "[ $symbol($version(-$name) )]($style)"

[cpp]
symbol = " "
style = "149 bold"
disabled = false
format = "[ $symbol($version(-$name) )]($style)"

[cmake]
symbol = " "
style = "bold blue"
format = "[ $symbol($version )]($style)"

[rust]
symbol = ""
style = "bold red"
format = "[ $symbol($version )]($style)"

[golang]
symbol = ""
style = "bold cyan"
format = "[ $symbol($version )]($style)"

[php]
symbol = ""
style = "147 bold"
format = "[ $symbol($version )]($style)"

[java]
symbol = ""
style = "red dimmed"
format = "[ $symbol($version )]($style)"

[kotlin]
symbol = ""
style = "bold blue"
format = "[ $symbol($version )]($style)"

[haskell]
symbol = ""
style = "bold purple"
format = "[ $symbol($version )]($style)"

[lua]
symbol = ""
style = "bold blue"
format = "[ $symbol ($version )]($style)"

[python]
symbol = " "
style = "yellow bold"
format = '[ ${symbol} ${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[dotnet]
symbol = ".NET "
style = "blue bold"
format = "[ $symbol($version )(🎯 $tfm )]($style)"

[elixir]
symbol = " "
style = "bold purple"
format = '[ $symbol($version \(OTP $otp_version\) )]($style)'

[zig]
symbol = " "
style = "bold yellow"
format = "[ $symbol($version )]($style)"

[scala]
symbol = " "
style = "red bold"
format = "[ $symbol($version )]($style)"

[docker_context]
symbol = ""
style = ""
format = "[[ $symbol( $context) ](color_blue)]($style)"

[conda]
style = ""
format = "[[ $symbol( $environment) ](color_blue)]($style)"

[pixi]
style = ""
format = "[[ $symbol( $version)( $environment) ](color_blue)]($style)"

[kubernetes]
symbol = " "
style = "cyan bold"
disabled = true
format = '[ $symbol$context( \($namespace\))]($style) in '

[helm]
format = "[  $version](bold white) "

[cmd_duration]
min_time = 200
show_milliseconds = true
format = "[$duration ](color_blue)"

[battery]
disabled = false
format = '[{ ](dimmed blue)[$symbol]($style)[ }](dimmed blue) '
full_symbol = "┃┃┃┃┃"
charging_symbol = "󱐋 ┃┃┃┃┃"
discharging_symbol = "┃┃┃┃┃"

[[battery.display]]
threshold = 100
style = "bold blue"
charging_symbol = "󱐋 ┃┃┃┃┃"
discharging_symbol = "┃┃┃┃┃"

[[battery.display]]
threshold = 90
style = "blue"
charging_symbol = "󱐋 ┃┃┃┃╻"
discharging_symbol = "┃┃┃┃╻"

[[battery.display]]
threshold = 80
style = "blue"
charging_symbol = "󱐋 ┃┃┃┃┆"
discharging_symbol = "┃┃┃┃┆"

[[battery.display]]
threshold = 70
style = "blue"
charging_symbol = "󱐋 ┃┃┃╻┆"
discharging_symbol = "┃┃┃╻┆"

[[battery.display]]
threshold = 60
style = "blue"
charging_symbol = "󱐋 ┃┃┃┆┆"
discharging_symbol = "┃┃┃┆┆"

[[battery.display]]
threshold = 50
style = "blue"
charging_symbol = "󱐋 ┃┃╻┆┆"
discharging_symbol = "┃┃╻┆┆"

[[battery.display]]
threshold = 40
style = "blue"
charging_symbol = "󱐋 ┃┃┆┆┆"
discharging_symbol = "┃┃┆┆┆"

[[battery.display]]
threshold = 30
style = "blue"
charging_symbol = "󱐋 ┃╻┆┆┆"
discharging_symbol = "┃╻┆┆┆"

[[battery.display]]
threshold = 20
style = "blue"
charging_symbol = "󱐋 ┃┆┆┆┆"
discharging_symbol = "┃┆┆┆┆"

[[battery.display]]
threshold = 10
style = "bold blue"
charging_symbol = "󱐋 ╻┆┆┆┆"
discharging_symbol = "╻┆┆┆┆"

[[battery.display]]
threshold = 0
style = "bold blue"
charging_symbol = "󱐋 ┆┆┆┆┆"
discharging_symbol = "┆┆┆┆┆"

[time]
disabled = false
time_format = "%R"
style = ""
format = "[[   $time ]( color_yellow )]($style)"

[line_break]
disabled = false

[character]
disabled = false
success_symbol = "[](bold fg:color_green)"
error_symbol = "[](bold fg:color_red)"
vimcmd_symbol = "[](bold fg:color_green)"
vimcmd_replace_one_symbol = "[](bold fg:color_purple)"
vimcmd_replace_symbol = "[](bold fg:color_purple)"
vimcmd_visual_symbol = "[](bold fg:color_yellow)"
